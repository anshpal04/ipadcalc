services:
  backend:
    build: ./backend
    ports:
      - "8900:8900"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_ORIGIN=http://localhost:3000

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8900
    ports:
      - "3000:3000"
    depends_on:
      - backend
